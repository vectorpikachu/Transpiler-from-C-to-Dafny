name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  release:
    needs: build  # 依赖 build 任务成功完成
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 安装 Rust 工具链
    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true

    # 安装 `cargo-bundle`
    - name: Install cargo-bundle
      run: cargo install cargo-bundle

    # 构建和发布
    - name: Build and release for multiple platforms
      run: |
        # 构建 Linux 可执行文件
        cargo build --release --target x86_64-unknown-linux-gnu
        # 构建 macOS 可执行文件
        cargo build --release --target x86_64-apple-darwin
        # 构建 Windows 可执行文件
        cargo build --release --target x86_64-pc-windows-msvc

    # 自动发布版本
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v0.1.0
        release_name: Release v0.1.0
        draft: false
        prerelease: false

    # 上传构建的可执行文件到发布页面
    - name: Upload Release Assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./target/x86_64-unknown-linux-gnu/release/CParser
        asset_name: CParser-linux
        asset_content_type: application/octet-stream

    - name: Upload macOS Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./target/x86_64-apple-darwin/release/CParser
        asset_name: CParser-macos
        asset_content_type: application/octet-stream

    - name: Upload Windows Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./target/x86_64-pc-windows-msvc/release/CParser.exe
        asset_name: CParser-windows.exe
        asset_content_type: application/octet-stream